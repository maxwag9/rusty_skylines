
name: Build & Release Rust Game

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag name for release (e.g. Alpha_v1.0.0a)"
        required: true

jobs:
  build:
    name: Build for all platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64

          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            artifact_name: linux-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: windows-arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm64

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            protobuf-compiler \
            libssl-dev \
            liblzma-dev

          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            sudo dpkg --add-architecture arm64

            sudo tee /etc/apt/sources.list.d/arm64.list > /dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          EOF

            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64/' /etc/apt/sources.list.d/ubuntu.sources

            sudo apt-get update

            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu \
              g++-aarch64-linux-gnu \
              libasound2-dev:arm64 \
              libudev-dev:arm64 \
              libssl-dev:arm64 \
              liblzma-dev:arm64

            mkdir -p .cargo

            cat > .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF

            {
              echo "PKG_CONFIG_ALLOW_CROSS=1"
              echo "PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig"
              echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
              echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
              echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
            } >> "$GITHUB_ENV"
          else
            sudo apt-get install -y --no-install-recommends \
              libasound2-dev \
              libudev-dev
          fi

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install pkg-config cmake

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install cmake -y --no-progress

          if ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") {
            choco install llvm -y --no-progress
            "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
          }

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          GAME_NAME="RustySkylines"
          VERSION="${{ github.event.inputs.release_tag }}"
          OUTDIR="artifacts/${{ matrix.artifact_name }}"
          BIN_PATH="target/${{ matrix.target }}/release"

          mkdir -p "$OUTDIR"

          find "$BIN_PATH" -maxdepth 1 -type f -perm -u+x \
            ! -name "*.d" \
            ! -name "*.rlib" \
            -exec cp {} "$OUTDIR/" \;

          if [ -d "data" ]; then
            cp -r data "$OUTDIR/data"
          fi

          tar -czf "${GAME_NAME}_${VERSION}_${{ matrix.artifact_name }}.tar.gz" \
            -C "$OUTDIR" .

      - name: Prepare artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $GameName = "RustySkylines"
          $Version = "${{ github.event.inputs.release_tag }}"
          $OutDir = "artifacts/${{ matrix.artifact_name }}"
          $BinPath = "target/${{ matrix.target }}/release"

          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null

          $exeFiles = Get-ChildItem -Path $BinPath -Filter "*.exe" -ErrorAction SilentlyContinue

          if ($exeFiles) {
            Copy-Item "$BinPath\*.exe" $OutDir
          } else {
            Write-Error "No .exe files found in $BinPath"
            exit 1
          }

          if (Test-Path "data") {
            Copy-Item -Recurse -Force "data" "$OutDir\data"
          }

          $items = Get-ChildItem -Path $OutDir -Recurse

          if (-not $items) {
            Write-Error "No artifacts found to compress in $OutDir"
            exit 1
          }

          Compress-Archive -Path "$OutDir\*" `
            -DestinationPath "${GameName}_${Version}_${{ matrix.artifact_name }}.zip"

      - name: Upload compressed artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}-package
          path: |
            RustySkylines_${{ github.event.inputs.release_tag }}_${{ matrix.artifact_name }}.zip
            RustySkylines_${{ github.event.inputs.release_tag }}_${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Gather release notes
        id: notes
        shell: bash
        run: |
          DESC=$(git log -1 --pretty=%B)
          {
            echo "desc<<EOF"
            echo "$DESC"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: RustySkylines ${{ github.event.inputs.release_tag }}
          body: ${{ steps.notes.outputs.desc }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
