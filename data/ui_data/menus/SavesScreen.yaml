name: SavesScreen
layers:
  - name: Backgrounds
    order: 2
    elements:
      - !Rect
        id: Menu Background
        x: 960
        y: 540
        w: 1920
        h: 1080
        rotation: 0.0
        color:
          - 0.01
          - 0.01
          - 0.01
          - 0.01
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness: 0.00
        fade: 0.0
        blur: 5.5
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: false
          touchable: false
          editable: true
      - !Rect
        id: Left_Buttons_Background
        x: 800
        y: 540
        w: 1100
        h: 900
        rotation: 0.0
        color:
          - 0.01
          - 0.01
          - 0.01
          - 0.98
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.02
        border_thickness: 2
        fade: 0.0
        blur: 5.5
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: true
      - !Text
        id: save_menu_text
        actions: [ ]
        x: 960
        y: 50
        pt: 24.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: Saves
        misc:
          active: true
          touchable: false
          editable: true
      - !Text
        id: back_to_main_menu_text
        actions:
          - on:r call(open_main_menus)
        x: 100
        y: 50
        pt: 24.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: <- To Main Menu
      - !Text
        id: delete_save_text
        actions: [ ]
        x: 800
        y: 1000
        pt: 18.0
        color:
          - 0.95
          - 0.00
          - 0.00
          - 1.0
        text: Delete Save (forever!)
      - !Text
        id: empty_save_text
        actions: [ ]
        x: 1120
        y: 1000
        pt: 18
        color:
          - 0.11
          - 0.845
          - 0.8
          - 1.0
        text: -> Enter temporary, empty save <-
      - !Text
        id: play_save_text
        actions:
          - on:r set(str:show_world, true); set(str:editor_mode, false); set(str:override_mode, false); load_save(selected_save.0, false); call(open_play_menus);
        x: 1060
        y: 950
        pt: 23.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: Play Save
      - !Text
        id: reload_saves_text
        actions:
          - on:startup, set(str:selected_save, [false])
          - on:startup set(str:reload_saves, "forin( saves, delete_layer(self.menu, expr:{val.0} + "_option", false) ); call(rust:str:get_saves); forin( saves, add_ap(self.menu, expr:{val.0} + "_option", save_option, val, [960.0, expr:100.0+{idx}*120.0], 2.0, true) )")
          #- on:startup set(str:reload_saves, "del_ap(self.menu, self.layer, {{saves.0}.0}_option); call(rust:str:get_saves); add_ap(self.menu, {{{saves}.0}.0}_option, save_option, {saves.0}, [960.0, 100.0+1*70.0], 2.0, true)")
          - on:press call(reload_saves)
        x: 240
        y: 950
        pt: 23.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: Reload Saves
      - !Text
        id: create_save_text
        actions:
          - on:press, set(str:prev_menus, active_menus); close_all_menus(); close_all_layers("CreateSave"); open_layer("CreateSave", "Difficulty")
        x: 440
        y: 950
        pt: 23.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: Create Save
      - !Rect
        id: World image
        actions: [ ]
        x: 1500
        y: 400
        w: 256
        h: 180
        color:
          - 0.9
          - 0.9
          - 0.9
          - 0.9
        roundness: 0.1
    editing_tool: false
