name: Debug_Menu
layers:
  - name: debug_texts
    order: 2
    elements:
      - !Text
        id: fps_text
        x: 0.0
        y: 0.0
        pt: 14.999999
        color:
          - 1.0
          - 0.0
          - 1.0
          - 1.0
        text: 'FPS: {fix({fps}, 2, 3)} | Frame: {(fix({render_dt} * 1000):.2)}ms | Render CPU: {fix({total_cpu_render_time}:.2, 2, 2)}ms | Sim: {({sim_dt} * 1000):.2}ms | {{fps} > 60 ? "Smooth" : "Laggy"}'
        anchor: TopLeft
      - !Text
        id: frametime_main_pass_text
        x: 0.0
        y: 20
        pt: 14.999999
        color:
          - 1.0
          - 0.0
          - 1.0
          - 1.0
        text: 'Total everything: {{total_frametime}:.2}ms, Sky: {{sky_frametime}:.2}ms, Stars: {{stars_frametime}:.2}ms, Terrain: {{terrain_frametime}:.2}ms, Water: {{water_frametime}:.2}ms, Roads: {{roads_frametime}:.2}ms, Reversed Depth Z: {reversed_depth_z}, MSAA: {{msaa_samples}x}'
        anchor: TopLeft
      - !Text
        id: gtao_frametimes_text
        x: 0.0
        y: 40
        pt: 14.999999
        color:
          - 1.0
          - 0.2
          - 0.2
          - 1.0
        text: 'GTAO: Total: {{gtao_frametime}:.2}ms, Prep: {{gtao_prep_frametime}:.2}ms, Generate: {{gtao_generate_frametime}:.2}ms, Blur: {{gtao_blur_frametime}:.2}ms, Upsample/Apply: {{gtao_upsample_apply_frametime}:.2}ms'
        anchor: TopLeft
      - !Text
        id: fog_frametime_text
        x: 0
        y: 60
        pt: 14.999999
        color:
          - 1.0
          - 0.0
          - 1.0
          - 1.0
        text: 'Fog: {{fog_frametime}:.2}ms, UI: {{ui_frametime}:.2}ms, Tonemapping: {{tonemap_frametime}:.2}ms, Cars: {{cars_frametime}:.2}ms, Props: {{props_frametime}:.2}ms, Gizmo: {{gizmo_frametime}:.2}ms'
        anchor: TopLeft
      - !Text
        id: shadows_frametime_text
        x: 0
        y: 80
        pt: 14.999999
        color:
          - 1.0
          - 0.0
          - 1.0
          - 1.0
        text: 'CSM Shadows: {{csm_frametime}:.2}ms, RT Total: {{rt_frametime}:.2}ms, RT Rays: {{rt_tracing_frametime}:.2}ms, RT Upsampling: {{rt_upsample_frametime}:.2}ms, RT Apply: {{rt_apply_frametime}:.2}ms'
        anchor: TopLeft
      - !Text
        id: sky_info_text
        x: 0.00037002563
        y: 100
        pt: 14.999999
        color:
          - 0.3
          - 0.5
          - 1.0
          - 1.0
        text: 'Requested Time Speed: {{time_speed}:.2}x, Actual Time Speed: {{achieved_time_speed}:.2}x, Total Game Time: {elapsed({total_game_time})}, Day length: {{day_length}:.2}s, Total_days: {{total_days}:.2}d, Sun declination: {{sun_declination}:.2} degrees'
        anchor: TopLeft
      - !Text
        id: player_info_text
        x: -0.0
        y: 120
        pt: 14.999999
        color:
          - 0.0
          - 0.5
          - 1.0
          - 1.0
        text: 'Player Pos: X: {{target_pos.x}:.2} Y: {{target_pos.y}:.2} Z: {{target_pos.z}:.2} Chunk Pos: CX: {{target_pos_cx}:.2} CZ: {{target_pos_cz}:.2}'
        anchor: TopLeft
      - !Text
        id: world_info_text
        x: 0.0
        y: 140
        pt: 14.999999
        color:
          - 1.0
          - 0.89762557
          - 0.08484942
          - 1.0
        text: 'Car Count: {car_count}, Cursor Mode: {cursor_mode}, Color: {color_picker_color}s'
        anchor: TopLeft
    editing_tool: false
