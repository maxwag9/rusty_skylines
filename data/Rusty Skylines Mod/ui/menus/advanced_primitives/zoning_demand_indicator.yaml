name: zoning_demand_indicator
elements:
  # inner indicator
  - !Rect
    id: Zoning Indicator
    actions:
      - as:["Zoning Border"] set(str:self.size.y, expr:{as.size.y}*{{ap}??0.5})
      - as:["Zoning Border"] set(str:self.center.y, expr:({as.center.y} + 0.5 * {as.size.y}) - 0.5 * ({as.size.y}*{{ap}??0.5}))
      - call(show_interaction, [[0.0, 0.5, 0.0, 1.0], true]))
      #- on:release, ifvareq(str:{ap}, bool:false, set_var(str:self.color.fill, [0.5, 0.0, 0.0, 1.0]), set_var(str:self.color.fill, [0.0, 0.5, 0.0, 1.0]))
    x: 0
    y: 0
    w: 28
    h: 38
    resize_behaviour:
      width: uniform
      height: uniform
    color:
      - 0.00
      - 0.50
      - 0.0
      - 0.9
    roundness: 0.2
    border_thickness: 1
  # Soft outer border
  - !Rect
    id: Zoning Border
    actions: [ ]
    x: 0
    y: 0
    w: 30
    h: 40
    resize_behaviour:
      width: uniform
      height: uniform
    color:
      - 0.00
      - 0.00
      - 0.00
      - 0.4
    border_color:
      - 1.0
      - 1.0
      - 1.0
      - 1.0
    roundness: 0.2
    border_thickness: 2

  - !Text
    id: zoning_value_text
    x: 0
    y: 0
    pt: 8.0
    color:
      - 0.94
      - 0.02
      - 0.09
      - 0.9
    text: '{expr:{{ap}??0}:.2}'
    anchor: Center