name: button
elements:
  # Outer border
  - !Rect
    id: Button_Background
    actions:
      - "in:any, as:[str:button_text], set(str:self.size, expr:{as.rect}+25.0); call(str:{ap.2});"
      - "on:hovering, set(str:self.color.border, [0.2, 0.1, 1.0, 1.0])"
      - "on:hover_exit on:activated, set(str:self.color.border, [0.02, 0.02, 0.02, 1.0])"
      - "on:hover_enter, call(rust:play_sound, str:ButtonHover)"
      - "on:press, call(rust:play_sound, str:ButtonPress)"
      #- "in:any, set(str:x, expr:{self.center.x}/{screen.x}); set(str:y, expr:{self.center.y}/{screen.y}); set(str:corner, expr:exp(-8.0*({x}*{x} + {y}*{y}))); set(str:self.color.border, [corner, expr:1-{corner}, expr:1-{corner}, 1])"
    x: 0
    y: 0
    w: 150
    h: 40
    resize_behaviour:
      width: x
      height: y
    color:
      - 0.8
      - 0.8
      - 0.8
      - 0.15
    border_color:
      - 0.1
      - 0.1
      - 0.1
      - 1.0
    roundness: 0.20
    border_thickness: 2
  # inner indicator
  #  - !Rect
  #    id: Checkbox Indicator
  #    actions:
  #      - on:release, toggle(str:{ap})
  #      #- button:a show_interaction(self.color.fill) # buggy
  #      - on:release on:activated button:a, ifvareq({ap}, bool:false, set_var(str:self.color.fill, [0.5, 0.0, 0.0, 1.0]), set_var(str:self.color.fill, [0.0, 0.5, 0.0, 1.0]))
  #    x: 0.0
  #    y: 0.0
  #    w: 40
  #    h: 40
  #    color:
  #      - 0.00
  #      - 0.50
  #      - 0.0
  #      - 1.0
  #    roundness: 0.5
  - !Text
    id: button_text
    actions:
      - on:activated, set(str:self.pt, {ap.1});
    x: 0
    y: 0
    pt: 25.0

    resize_behaviour:
      width: uniform
      height: y
    color:
      - 1.0
      - 1.0
      - 1.0
      - 0.9
    text: '{ap.0}'
    anchor: Center
    decorations:
      - color: [ 1.0, 0.0, 0.0, 1.0 ]
        spread: 2.0
        mode: Ring

      - color: [ 0.0, 1.0, 0.0, 0.8 ]
        spread: 4.0
        offset: [ 3.0, 0.0 ]
        mode: Solid

      - color: [ 0.0, 0.3, 1.0, 0.9 ]
        spread: 6.0
        offset: [ -4.0, 2.0 ]
        mode: Solid

      - color: [ 1.0, 0.0, 1.0, 0.7 ]
        offset: [ 6.0, -3.0 ]
        blur: 3.0
        mode: Solid

      - color: [ 1.0, 0.8, 0.0, 0.9 ]
        spread: 8.0
        offset: [ -7.0, -2.0 ]
        mode: Solid

      - color: [ 0.0, 1.0, 1.0, 0.6 ]
        offset: [ 2.0, 7.0 ]
        blur: 4.0
        mode: Solid

      - color: [ 1.0, 0.2, 0.5, 0.8 ]
        spread: 5.0
        offset: [ -6.0, 5.0 ]
        mode: Solid

      - color: [ 0.6, 0.2, 1.0, 0.75 ]
        offset: [ 8.0, 4.0 ]
        blur: 7.0
        mode: Solid




    misc:
      active: true
      touchable: false
      editable: true