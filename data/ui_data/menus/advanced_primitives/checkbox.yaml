name: checkbox
elements:
  # Outer border
  - !Rect
    id: Checkbox Border
    actions:
      - on:release, toggle(str:{ap})
      - button:a show_interaction(self.color.fill)
    x: 0.0
    y: 0.0
    w: 60
    h: 60
    color:
      - 0.00
      - 0.00
      - 0.00
      - 1.0
    border_color:
      - 1.0
      - 1.0
      - 1.0
      - 1.0
    roundness: 0.1
    border_thickness_percentage: 0.05
  # inner indicator
  - !Rect
    id: Checkbox Indicator
    actions:
      - on:release, toggle(str:{ap})
      #- button:a show_interaction(self.color.fill) # buggy
      - on:release on:activated button:a, ifvareq({ap}, bool:false, set_var(str:self.color.fill, [0.5, 0.0, 0.0, 1.0]), set_var(str:self.color.fill, [0.0, 0.5, 0.0, 1.0]))
    x: 0.0
    y: 0.0
    w: 40
    h: 40
    color:
      - 0.00
      - 0.50
      - 0.0
      - 1.0
    roundness: 0.5
  - !Text
    id: setting_text
    x: 0.00
    y: -55
    pt: 10.0
    color:
      - 1.0
      - 1.0
      - 1.0
      - 0.9
    text: '{ap}'