[package]
name = "Rusty_Skylines"
version = "0.9.4-b"
edition = "2024"

[dependencies]
winit = { version = "0.31.0-beta.4", features = ["serde"] }
wgpu = { version = "30.0.2", features = ["strict_asserts"] }

pollster = "1.0.3"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.34.3", features = ["serde"] }
toml = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
notify = "9.0.0"
num_cpus = "1.17.0"
crossbeam-channel = "0.5.17"
rand = "0.10.4"
zstd = "0.14.5"
serde_yaml = { version = "0.9.34" }
wgpu_render_manager = "30.0.14"                          # HERE!
earcutr = "0.5.0"
clipper2-rust = "1.3.0"
rayon = "1.12.0"
cpal = "0.18.2"
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
sanitize-filename = "0.8.0-beta"
image = "0.25.10"
dirs = "7.0.0"
chrono = "0.4.45"
strum_macros = "0.28.0"
strum = "0.28.0"
xxhash-rust = { version = "0.8.21", features = ["xxh3"] }
rand_chacha = "0.10.0"
gilrs = "0.11.2"
rand_distr = "0.6.0"
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = "0.3.23"
libc = "1.0.0-alpha.5"
revision = "0.30.0"
sysinfo = "0.40.4"
#glyphon = "0.12.0" ඞ
#wgpu_text = "30.0.1" ඞvඞ
owo-colors = "4.4.0"
unicode-segmentation = "1.13.3"
#fontdb = "0.24.0" ඞඞඞ
smallvec = "2.0.0-beta.5"
sluggrs_skylines = "0.3.4" # Better than you
xz2 = "0.1.7"
lz4_flex = "0.14.2"
unarc-rs = "0.8.1"
thiserror = "2.0.21"
jxl-image-rs-integration = "0.8.0"
resvg = "0.50.0"
tiny-skia = "0.12.0"
usvg = "0.50.0"
phf = { version = "0.14", features = ["macros"] }
emojis = "0.9.1"
whoami = "2.1.3"
noisy_skylines = { git = "https://github.com/maxwag9/noisy_skylines.git" }
rusty_skylines_utils = { git = "https://github.com/maxwag9/rusty_skylines_utils.git" }
all-smi = { version = "0.29.1", default-features = false }
nvml-wrapper = "0.13.0"
serde_json = "1"
[target.'cfg(target_os = "linux")'.dependencies]
libdrm_amdgpu_sys = { version = "0.9", default-features = false, features = ["dynamic_loading"] }

[profile.fastdev]
inherits = "release"      # start with release defaults
opt-level = 1         # override with release-level speed (the same lol)
debug = true           # keep debug symbols
split-debuginfo = "packed"
overflow-checks = true
lto = false
incremental = true