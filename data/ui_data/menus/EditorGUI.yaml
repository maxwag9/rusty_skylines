        roundness: 0.4
        border_thickness_percentage: 0.002
        fade: 0.0
        blur: 4.0
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: true
          editable: false
      - !Rect
        id: Father
