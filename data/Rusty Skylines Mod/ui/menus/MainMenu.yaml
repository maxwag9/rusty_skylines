name: MainMenu
layers:
  - name: main_menu_buttons
    order: 2
    elements:
      - !Rect
        id: Menu Background
        x: 960
        y: 540
        w: 1920
        h: 1080
        rotation: 0.0
        color:
          - 0.01
          - 0.01
          - 0.01
          - 0.01
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness: 0.00
        fade: 0.0
        blur: 5.5
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: true
      - !Rect
        id: Buttons Background
        x: 960
        y: 550
        w: 700
        h: 600
        rotation: 0.0
        texture: "shader:shaders/fun!/test1.wgsl"
        color:
          - 0.01
          - 0.01
          - 0.01
          - 0.08
        border_color:
          - 2.0
          - 1.0
          - 1.0
          - 1.0
        roundness: 0.1
        border_thickness: 3
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }

      - !Advanced
        name: play_button
        ap_name: button
        ap_vars:
          - "str:Play"
          - "70"
          - "str:on:r set(str:editor_mode, false); set(str:override_mode, false); call(open_save_menus);"
        x: 960
        y: 330
        scale: 1.0

        editing_tool: false
      - !Advanced
        name: settings_button
        ap_name: button
        ap_vars:
          - "str:Settings"
          - "50"
          - "str:on:r set(str:editor_mode, false); set(str:override_mode, false); call(open_settings_menus);"
        x: 960
        y: 440
        scale: 1.0

        editing_tool: false
      - !Advanced
        name: minigames_button
        ap_name: button
        ap_vars:
          - "str:Minigames!"
          - "50"
          - "str:on:r close_all_menus; open_menu(str:MiniGames); call(rust:play_sound, PixelQuestTheme)"
        x: 960
        y: 640
        scale: 1.0

        editing_tool: false
      - !Advanced
        name: exit_game_button
        ap_name: button
        ap_vars:
          - "str:Exit Game"
          - "50"
          - "str:on:r exit_game()"
        x: 960
        y: 730
        scale: 1.0

        editing_tool: false
      - !Text
        id: rusty_skylines
        actions: [ ]
        x: 960
        y: 100
        pt: 200.0
        color:
          - 0.2
          - 0.56
          - 1.0
          - 1.0
        text: RUSTY SKYLINES


      - !Advanced
        name: sound_button
        ap_name: button
        ap_vars:
          - "str:Audio Jungle"
          - "40"
          - "str:on:r call(rust:str:play_sound, str:PixelQuestTheme)"
        x: 960
        y: 1030
        scale: 1.0

    editing_tool: false
