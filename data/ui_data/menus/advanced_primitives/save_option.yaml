name: save_option
elements:
  - !Rect
    id: World Background
    actions:
      - as:["SavesScreen", "Backgrounds", "Left_Buttons_Background"], set(str:self.size.x, expr:{as.size.x}*0.6); set(str:self.size.y, expr:{as.size.x}*0.06);
      - as:["world_name_text"], set(str:self.center.x, expr:{as.center.x}+{self.size.x}*0.48);
      - on:press, set(str:selected_save, {ap.all})
      - if(expr:{selected_save.0}=="{ap.0}",
        set(str:self.color.border, [0.0, 1.0, 0.0, 1.0]); set(str:self.color.fill, [0.0, 0.0, 0.05, 1.0]),
        set(str:self.color.border, [0.1, 0.1, 0.1, 1.0]); set(str:self.color.fill, [0.01, 0.01, 0.01, 1.0]) )

      - on:hovering,
        if(expr:{selected_save.0}=="{ap.0}",
        set(str:self.color.border, [0.0, 1.0, 1.0, 1.0]),
        set(str:self.color.border, [1.0, 1.0, 1.0, 1.0])
        )

      - on:hover_exit,
        if(expr:{selected_save.0}=="{ap.0}",
        set(str:self.color.border, [0.0, 1.0, 0.0, 1.0]),
        set(str:self.color.border, [0.1, 0.1, 0.1, 1.0])
        )

    x: 0
    y: 0
    w: 300
    h: 30
    color:
      - 0.00
      - 0.00
      - 0.00
      - 0.8
    border_color:
      - 0.1
      - 0.1
      - 0.1
      - 1.0
    roundness: 0.05
    border_thickness: 4


  - !Text
    id: world_name_text
    actions: [ ]
    x: 0
    y: -5
    pt: 14.0
    color:
      - 1.0
      - 1.0
      - 1.0
      - 0.9
    text: '{ap.0}'
    anchor: CenterLeft
    misc:
      pressable: false
  #  - !Text
  #    id: world_load_result_text
  #    actions: [ ]
  #    x: 40
  #    y: 15
  #    pt: 6.0
  #    color:
  #      - 1.0
  #      - 1.0
  #      - 1.0
  #      - 0.9
  #    text: 'Load result: {ap.1}'
  #    anchor: Center
  #    misc:
  #      active: true
  #      pressable: false
  #      editable: true
  - !Text
    id: world_info_text
    actions: [ ]
    x: 0
    y: 12
    pt: 6.0
    color:
      - 1.0
      - 1.0
      - 1.0
      - 0.9
    text: '{expr:elapsed({ap.2}, true)}, Chunk Size: {ap.3}, Difficulty: {ap.4}'
    anchor: TopLeft
    misc:
      pressable: false