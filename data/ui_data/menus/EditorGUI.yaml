          - 0.0
        glow_misc: { }
        misc:
          active: false
          touchable: true
          editable: false
      - !Circle
        id: add
        actions:
          - button:any in:any as:"[str:Background]", set(str:self.center, [({as.center.x}-({as.size.x}*0.4)), as.center.y]); set(str:self.radius, {as.size.y}*0.40)
        x: 0.3
        y: 0.5
        radius: 0.04
        fill_color:
