          - 0.0
        glow_misc: { }
        misc:
          touchable: false
      - !Advanced
        name: world_name_textbox
        ap_name: textbox
        ap_vars:
          - "str:World Name"
          - "50"
          - "str:as:[str:button_text] set(str:new_save_name, as.text);"
        x: 960
        y: 440
        scale: 1.0
        editing_tool: false
      - !Advanced
        name: create_the_save_finally_button
        ap_name: button
        ap_vars:
          - "str:Create Save: '{new_save_name}'"
          - "40"
          - "str:on:r call(rust:create_save, [new_save_name, new_difficulty]); set(str:show_world, true); set(str:editor_mode, false); set(str:override_mode, false); load_save(new_save_name, false); call(open_play_menus);"
        x: 1560
        y: 1010
        scale: 1.0
      - !Advanced
        name: difficulty_slider
        ap_name: slider
        ap_var:
          - "str:new_difficulty"
          - "str:Difficulty"
          - "0"
          - "1"
          - "1"
          - "[str:Easy, str:Hard]"
          - "[str:Easy, str:Hard]"
          - "true"
        x: 1075
        y: 600
        scale: 1.5
    editing_tool: false