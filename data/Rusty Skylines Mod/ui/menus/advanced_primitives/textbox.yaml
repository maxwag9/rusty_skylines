name: textbox
elements:
  # Outer border
  - !Rect
    id: Button_Background

      #- "in:any, set(str:x, expr:{self.center.x}/{screen.x}); set(str:y, expr:{self.center.y}/{screen.y}); set(str:corner, expr:exp(-8.0*({x}*{x} + {y}*{y}))); set(str:self.color.border, [corner, expr:1-{corner}, expr:1-{corner}, 1])"
    x: 0
    y: 0
    w: 150
    h: 30
    color:
      - 0.8
      - 0.8
      - 0.8
      - 0.05
    border_color:
      - 0.1
      - 0.1
      - 0.1
      - 1.0
    roundness: 0.10
    border_thickness: 2
  - !Text
    id: button_text
    actions:
      - 'on:startup, set(str:self.anchor, str:{ap.2}); set(str:open_chat, str:text_utils(self.menu, self.layer, self.id, str:TextEditStart); text_utils(self.menu, self.layer, self.id, str:BlockLinebreak); set(str:self.color.fill, [1.0, 1.0, 1.0, 1.0]); ifvareq(self.template, ap.0, set(str:self.tt, str:);); ); set(str:post_chat, "call(ap.4); set(str:self.tt, ap:ap.0); deselect_all();"); set(str:close_chat, str:deselect_all());'
      - 'in:any as:[Button_Background], set(str:self.pt, expr:scaled_pt({ap.1})); set(str:as.size, expr:{self.size}+15.0); set(str:as.center, expr:{self.anchor_center}+{as.size}*0.5);  call({ap.3});'
      - "on:hovering as:[Button_Background], set(str:as.color.border, [1.0, 1.0, 1.0, 1.0])"
      - "on:hover_exit on:activated as:[Button_Background], set(str:as.color.border, [0.1, 0.1, 0.1, 1.0])"

      - 'on:desel, ifvareq(self.template, "", set(str:self.tt, {ap.0}); ); set(str:self.color.fill, [0.4, 0.4, 0.4, 0.8]); call(str:{ap.5});' # Shit, deselect is global...
      - "on:startup, set(str:self.tt, str:{ap.0}); set(str:self.color.fill, [0.4, 0.4, 0.4, 0.8]);"
      - 'button:"Enter*" trigger:r, call(post_chat)'
      - 'on:press, call(open_chat); '

    x: 0
    y: 0
    pt: 25.0
    color:
      - 1.0
      - 1.0
      - 1.0
      - 0.9
    text: '{ap.0}'
    anchor: Center
    decorations:
      - color: [ 0.0, 0.0, 0.0, 1.0 ]
        spread: 2.0
    input_box: Custom