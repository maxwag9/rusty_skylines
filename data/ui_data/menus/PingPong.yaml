name: PingPong
layers:
  - name: pingpong
    order: 2
    elements:
      - !Rect
        id: Background
        x: 0.5
        y: 0.5
        w: 1.0
        h: 1.0
        rotation: 0.0
        color:
          - 0.03
          - 0.03
          - 0.03
          - 1.0
        border_color:
          - 0.1
          - 0.1
          - 0.1
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness_percentage: 0.0
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: false
      - !Rect
        id: Center Line
        x: 0.5
        y: 0.5
        w: 0.02
        h: 1.0
        rotation: 0.0
        color:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness_percentage: 0.01
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: true
      - !Text
        id: ping_pong_text
        x: 0.5
        y: 0.07
        pt: 25.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: Ping Pong in Rusty Skylines UI!
      - !Text
        id: back_text
        actions:
          - on:r call(open_main_menus)
        x: 0.1
        y: 0.05
        pt: 18.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: <- Back to Main Menu
      - !Text
        id: faster_text
        actions:
          - on:d inc(str:ball.speed, 0.1)
        x: 0.1
        y: 0.09
        pt: 14.999999
        color:
          - 0.1
          - 1.0
          - 0.1
          - 1.0
        text: Make ball faster!
      - !Text
        id: slower_text
        actions:
          - on:d dec(str:ball.speed, 0.1)
        x: 0.1
        y: 0.12
        pt: 14.999999
        color:
          - 1.0
          - 0.1
          - 0.1
          - 1.0
        text: Make ball slower...
      - !Text
        id: home_score_text
        x: 0.05
        y: 0.02
        pt: 16.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: 'Home Score: {ball.home_score}'
        misc:
          active: true
          touchable: false
          editable: true
      - !Text
        id: visitor_score_text
        x: 0.9
        y: 0.02
        pt: 16.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: 'Visitor Score: {ball.visitor_score}'
        misc:
          active: true
          touchable: false
          editable: true
    editing_tool: false
  - name: pingpong_moving_stuff
    order: 2
    elements:
      - !Circle
        id: ball
        actions:
          - on:activated button:a set(str:ball.orig_radius, {self.radius}); set(str:ball.squish, 1.0)
          - on:n button:a set(str:self.center.x, {self.center.x} + {ball.velocity.x} * {ball.speed})
          - on:n button:a set(str:self.center.y, {self.center.y} + {ball.velocity.y} * {ball.speed})
          - on:n button:a if({self.center.y} < {self.radius}, if({ball.velocity.y} * {ball.speed} < 0, set(str:ball.velocity.y, -{ball.velocity.y})))
          - on:n button:a if({self.center.y} > {screen.y} - {self.radius}, if({ball.velocity.y} * {ball.speed} > 0, set(str:ball.velocity.y, -{ball.velocity.y})))
        style: Hue Circle
        x: 0.6
        y: 0.5
        radius: 0.02804
        fill_color:
          - 0.5
          - 0.5
          - 0.5
          - 0.98
        glow_color:
          - 0.2
          - 0.0
          - 0.7
          - 0.98
        glow_misc:
          glow_size: 40.0
          glow_speed: 5.0
          glow_intensity: 0.5
        misc:
          active: true
          touchable: false
          editable: true
      - !Rect
        id: left paddle
        actions:
          - on:activated button:a set(str:left_paddle.orig_center_x, {self.center.x}); set(str:left_paddle.knock_x, 0.0)
          - on:n button:"KeyW" if({self.center.y} - {self.size.y}*0.5 > {paddle_speed}+1, set(str:self.center.y, {self.center.y} - {paddle_speed}))
          - on:n button:"KeyS" if({self.center.y} + {self.size.y}*0.5 < {screen.y} - ({paddle_speed}+1), set(str:self.center.y, {self.center.y} + {paddle_speed}))
          - on:n button:a set(str:left_paddle.size, self.size)
          - on:n button:a set(str:left_paddle.center, self.center)
          - on:n button:a if({left_paddle.knock_x} != 0.0, set(str:self.center.x, {self.center.x} + {left_paddle.knock_x}); set(str:left_paddle.knock_x, {left_paddle.knock_x} * 0.82))
          - on:n button:a set(str:self.center.x, {self.center.x} * 0.92 + {left_paddle.orig_center_x} * 0.08)
        x: 0.014140624
        y: 0.5
        w: 0.02
        h: 0.2
        rotation: 0.0
        color:
          - 0.5
          - 1.0
          - 0.5
          - 1.0
        border_color:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
        texture: null
        roundness: 0.3
        border_thickness_percentage: 0.01
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.2
          - 0.7
          - 0.2
          - 0.98
        glow_misc:
          glow_size: 30.0
          glow_speed: 4.0
          glow_intensity: 0.5
        misc:
          active: true
          touchable: false
          editable: true
      - !Rect
        id: right paddle
        actions:
          - on:activated button:a set(str:right_paddle.orig_center_x, {self.center.x}); set(str:right_paddle.knock_x, 0.0)
          - on:n button:"ArrowUp" if({self.center.y} - {self.size.y}*0.5 > {paddle_speed}+1, set(str:self.center.y, {self.center.y} - {paddle_speed}))
          - on:n button:"ArrowDown" if({self.center.y} + {self.size.y}*0.5 < {screen.y} - ({paddle_speed}+1), set(str:self.center.y, {self.center.y} + {paddle_speed}))
          - on:n button:a set(str:right_paddle.size, self.size)
          - on:n button:a set(str:right_paddle.center, self.center)
          - on:n button:a if({right_paddle.knock_x} != 0.0, set(str:self.center.x, {self.center.x} + {right_paddle.knock_x}); set(str:right_paddle.knock_x, {right_paddle.knock_x} * 0.82))
          - on:n button:a set(str:self.center.x, {self.center.x} * 0.92 + {right_paddle.orig_center_x} * 0.08)
        x: 0.9858594
        y: 0.5
        w: 0.02
        h: 0.2
        rotation: 0.0
        color:
          - 1.0
          - 0.5
          - 0.5
          - 1.0
        border_color:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
        texture: null
        roundness: 0.3
        border_thickness_percentage: 0.01
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.7
          - 0.0
          - 0.2
          - 0.98
        glow_misc:
          glow_size: 30.0
          glow_speed: 4.0
          glow_intensity: 0.5
        misc:
          active: true
          touchable: false
          editable: true
    editing_tool: false
