name: SavesScreen
layers:
  - name: Backgrounds
    order: 2
    elements:
      - !Rect
        id: Menu Background
        actions:
          - on:startup, set(str:selected_save.0, none:None)
        x: 960
        y: 540
        w: 1920
        h: 1080
        rotation: 0.0
        color:
          - 0.01
          - 0.01
          - 0.01
          - 0.01
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness: 0.00
        fade: 0.0
        blur: 5.5
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: false
          touchable: false
          editable: true
      - !Rect
        id: Left_Buttons_Background
        x: 800
        y: 560
        w: 1200
        h: 1000
        rotation: 0.0
        color:
          - 0.002
          - 0.002
          - 0.002
          - 0.98
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.02
        border_thickness: 2
        fade: 0.0
        blur: 5.5
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: true
      - !Text
        id: save_menu_text
        actions: [ ]
        x: 960
        y: 50
        pt: 30.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: Saves
        misc:
          touchable: false
      - !Advanced
        name: back_to_main_menu_text
        ap_name: button
        ap_vars:
          - "str:<- To Main Menu"
          - "40"
          - "str:on:r call(open_main_menus)"
        x: 100
        y: 100
        scale: 1.0
      - !Advanced
        name: delete_save_text
        ap_name: button
        ap_vars:
          - "str:Delete Save (forever!)"
          - "40"
          - "str:on:r call(open_main_menus)"
        x: 340
        y: 620
        scale: 1.0
      - !Advanced
        name: empty_save_text
        ap_name: button
        ap_vars:
          - "str:-> Enter temporary, empty save <-"
          - "40"
          - "str:on:r call(open_main_menus)"
        x: 340
        y: 680
        scale: 1.0

      - !Advanced
        name: reload_saves_text
        ap_name: button
        ap_vars:
          - "str:Reload Saves"
          - "40"
          - "str:on:press on:activated call(var:reload_saves)"
        x: 340
        y: 740
        scale: 1.0
      - !Advanced
        name: create_save_text
        ap_name: button
        ap_vars:
          - "str:Create Save"
          - "40"
          - str:on:press set(str:prev_menus, active_menus); close_all_menus(); close_all_layers("CreateSave"); open_layer("CreateSave", "Difficulty")
        x: 340
        y: 800
        scale: 1.0
      - !Advanced
        name: play_save_text
        ap_name: button
        ap_vars:
          - "str:Play Save"
          - "40"
          - "str:on:r set(str:show_world, true); set(str:editor_mode, false); set(str:override_mode, false); load_save(selected_save.0, false); call(open_play_menus);"
        x: 340
        y: 860
        scale: 1.0
      - !Rect
        id: World image
        actions: [ ]
        x: 1600
        y: 400
        w: 256
        h: 180
        color:
          - 0.9
          - 0.9
          - 0.9
          - 0.9
        roundness: 0.1
    editing_tool: false
