name: MainMenu
layers:
  - name: main_menu_buttons
    order: 2
    elements:
      - !Rect
        id: Menu Background
        x: 960
        y: 540
        w: 1920
        h: 1080
        rotation: 0.0
        color:
          - 0.01
          - 0.01
          - 0.01
          - 0.01
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness: 0.00
        fade: 0.0
        blur: 5.5
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: true
      - !Rect
        id: Buttons Background
        x: 960
        y: 450
        w: 400
        h: 400
        rotation: 0.0
        color:
          - 0.01
          - 0.01
          - 0.01
          - 0.98
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.2
        border_thickness: 4
        fade: 0.0
        blur: 5.5
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }

      - !Advanced
        name: play_button
        ap_name: button
        ap_vars:
          - "str:Play"
          - "40"
          - "str:on:r set(str:editor_mode, false); set(str:override_mode, false); call(open_save_menus);"
        x: 960
        y: 330
        scale: 1.0

        editing_tool: false
      - !Advanced
        name: settings_button
        ap_name: button
        ap_vars:
          - "str:Settings"
          - "30"
          - "str:on:r set(str:editor_mode, false); set(str:override_mode, false); call(open_settings_menus);"
        x: 960
        y: 440
        scale: 1.0

        editing_tool: false
      - !Advanced
        name: pingpong_button
        ap_name: button
        ap_vars:
          - "str:Ping Pong!"
          - "30"
          - "str:on:r close_all_menus; open_menu(str:PingPong); set(str:ball.direction, 0.9); set(str:ball.speed, 3.0); 
              set(str:ball.velocity.x, expr:cos({ball.direction})*2); set(str:ball.velocity.y, expr:sin({ball.direction})*2); 
              set(str:paddle_speed, 30); set(str:show_world, false); set(str:ball.home_score, 0); set(str:ball.visitor_score, 0);"
        x: 960
        y: 540
        scale: 1.0

        editing_tool: false
      - !Advanced
        name: exit_game_button
        ap_name: button
        ap_vars:
          - "str:Exit Game"
          - "30"
          - "str:on:r exit_game()"
        x: 960
        y: 610
        scale: 1.0

        editing_tool: false
      - !Text
        id: rusty_skylines
        actions: [ ]
        x: 960
        y: 100
        pt: 200.0
        color:
          - 0.2
          - 0.56
          - 1.0
          - 1.0
        text: RUSTY SKYLINES
    editing_tool: false
