name: pause_button
elements:
  - !Circle
    id: pause button
    actions:
      - on:release button:a, toggle(str:{ap})
      - button:a, ifvareq(bool({{ap}}), bool:false, set_var(str:self.color.fill, [0.5, 0.0, 0.0, 1.0]), set_var(str:self.color.fill, [0.0, 0.5, 0.0, 1.0]))
    x: 0.0
    y: 0.0
    radius: 0.02
    fill_color:
      - 0.5
      - 0.5
      - 0.5
      - 0.98
    glow_color:
      - 0.2
      - 0.0
      - 0.7
      - 0.98
    glow_misc:
      glow_size: 40.0
      glow_speed: 5.0
      glow_intensity: 0.5
    misc:
      active: true
      pressable: false
      editable: true