element_actions:
  - button:r, on:r, in:editor_mode, open_layer(str:Editor_Menu, str:Color Picker)
  - on:desel, in:editor_mode, close_layer(str:Editor_Menu, str:Color Picker)

global_actions:
  - on:startup in:any, call(rust:str:get_saves);
  #- on:startup in:any, print(saves);
  # Menus for each screen
  - on:startup in:any, set(str:main_menus, [MainMenu]);
  - on:startup in:any, set(str:pause_menus, [PauseMenu]);
  - on:startup in:any, set(str:settings_menus, [Settings]);
  - on:startup in:any, set(str:play_menus, [GUI]);
  - on:startup in:any, set(str:editor_menus, [Editor_Menu, EditorGUI]);
  - on:startup in:any, set(str:save_menus, [SavesScreen]);
  #  - if(!{bool(before_editor_mode)} && {editor_mode}, print(AMOGUSZ); close_all_menus(); call(open_editor_menus))
  #  - if({bool(before_editor_mode)} && !{editor_mode}, close_all_menus(); open_menu(prev_menus))
  #  - set(str:before_editor_mode, editor_mode)
  #- if(!editor_mode, set(str:prev_menus, active_menus))
  - on:startup in:any, set(str:open_prev, "in:any, close_all_menus(); open_menu(prev_menus);")
  - on:startup in:any, set(str:open_main_menus, "in:any, set(str:editor_mode, false); set(str:show_gui, true); set(str:prev_menus, active_menus); close_all_menus(); open_menu(main_menus);")
  - on:startup in:any, set(str:open_pause_menus, "in:any, set(str:editor_mode, false); set(str:show_gui, true); set(str:prev_menus, active_menus); close_all_menus(); open_menu(pause_menus);" )
  - on:startup in:any, set(str:open_settings_menus, "set(str:prev_menus, active_menus); close_all_menus(); open_menu(settings_menus)")
  - on:startup in:any, set(str:open_play_menus, "set(str:prev_menus, active_menus); close_all_menus(); open_menu(play_menus); if(debug_mode == true, open_menu(Debug_Menu); );" )
  - on:startup in:any, set(str:open_editor_menus, "in:any, set(str:prev_menus, active_menus); open_menu(editor_menus); set(str:editor_mode, true); set(str:show_gui, true); set(str:show_world, false); close_all_layers(Editor_Menu);")
  - on:startup in:any, set(str:open_save_menus, "set(str:prev_menus, active_menus); close_all_menus(); open_menu(save_menus)")
  - on:startup in:any, set(str:back_to_the_game, "set(str:show_world, true); set(str:editor_mode, false); set(str:override_mode, false); call(open_play_menus);")
  - on:startup in:any, set(str:editor_mode, false); call(open_main_menus);
  #
  #  - on:startup, set(str:func_name, ["button:l on:release, print(hi)", "button:r on:down, print(you have chosen the dark side!! {args.0})"])
  #  - on:always, call(func_name, ["HURENSOHN HAHA!!"])
  - on:startup, set(str:to_the_menu, [
    "button:"Resume" trigger:r, menu_active(PauseMenu); if(_result, call(back_to_the_game) ); set(str:just_resumed_from_pause_menu, _result);", 
    "button:"Leave Game" trigger:r, menu_active(MainMenu); if(_result, exit_game());", 
    "button:"Exit to Main Menu" trigger:r in:any, if(expr:is_some({current_save}), if(expr:!{just_resumed_from_pause_menu}, call(open_pause_menus)), call(open_main_menus) ); set(str:just_resumed_from_pause_menu, false)"
    ])
  - in:any, call(to_the_menu)
  #
  #- button:"KeyQ" trigger:r in:any, debug_menus();  # _Ok I get it, so 'x.exists' didn't work because {ap.5}.exists was replaced with '.exists' and that returns it as a full string. because the ap.5 value is
  - button:"Toggle editor mode" trigger:repeat in:any, toggle(str:editor_mode); if({editor_mode}, call(open_editor_menus));
  - button:"Toggle Fullscreen" trigger:repeat in:any, toggle(str:fullscreen_mode);