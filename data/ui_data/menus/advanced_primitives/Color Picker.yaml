name: Color Picker
elements:
  - !Rect
    id: Color Picker Body
    x: 0
    y: 0
    w: 200
    h: 300
    rotation: 0.0
    color:
      - 0.001
      - 0.001
      - 0.001
      - 0.95
    border_color:
      - 0.5
      - 0.5
      - 0.5
      - 1.0
    texture: null
    roundness: 0.2
    border_thickness_percentage: 4
    fade: 0.0
    blur: 0.0
    glow_color:
      - 0.0
      - 0.0
      - 0.0
      - 0.0
    glow_misc: { }
    misc:
      active: true
      touchable: true
      editable: false
  - !Text
    id: Color Picker Title
    x: 0
    y: -135
    pt: 20
    color:
      - 0.14588779
      - 1.0
      - 0.017024457
      - 1.0
    text: ColorPicker
    misc:
      active: true
      touchable: true
      editable: false
  - !Text
    id: Color Picker Red Input Box
    x: 0
    y: 120
    pt: 15
    color:
      - 0.7
      - 0.7
      - 0.7
      - 1.0
    text: 'Red: {color_picker_color.r:.2}'
    misc:
      active: true
      touchable: true
      editable: false
    input_box: true
  - !Text
    id: Color Picker Green Input Box
    x: 0
    y: 130
    pt: 15
    color:
      - 0.7
      - 0.7
      - 0.7
      - 1.0
    text: 'Green: {color_picker_color.g:.2}'
    misc:
      active: true
      touchable: true
      editable: false
    input_box: true
  - !Text
    id: Color Picker Blue Input Box
    x: 0
    y: 140
    pt: 15
    color:
      - 0.7
      - 0.7
      - 0.7
      - 1.0
    text: 'Blue: {color_picker_color.b:.2}'
    misc:
      active: true
      touchable: true
      editable: false
    input_box: true
  - !Circle
    id: Color Picker Color Circle
    actions:
      - button:l, on:drag, in:editor_mode, set(str:angle_shifted, expr:atan2({mouse.y} - {self.center.y}, {mouse.x} - {self.center.x}) + PI/2)
      - button:l, on:drag, in:editor_mode, set(str:color_picker_hsv.h, expr:atan2(sin({angle_shifted}), cos({angle_shifted})) / (2*PI) + 0.5)
      - button:l, on:drag, in:editor_mode, set(str:color_picker_hsv.s, expr:clamp(sqrt(({mouse.x} - {self.center.x})**2 + ({mouse.y} - {self.center.y})**2) / {self.radius}, 0.0, 1.0))
      - button:l, on:drag, in:editor_mode, set(str:color_picker_color, expr:hsv_to_rgb({color_picker_hsv.h}, pow({color_picker_hsv.s}, 0.47), 1.0))
      - button:l, on:drag, in:editor_mode, set(str:editing.color.fill, color_picker_color)
    style: Hue Circle
    x: 0
    y: -40
    radius: 95
    fill_color:
      - 0.7994889
      - 0.91996294
      - 1.0
      - 1.0
    glow_color:
      - 0.0
      - 0.0
      - 0.0
      - 0.0
    glow_misc: { }
    misc:
      active: true
      touchable: true
      editable: false
  - !Circle
    id: Color Picker Drag Circle
    actions: [ ]
    x: 0
    y: -40
    radius: 15
    fill_color:
      - 0.2
      - 0.2
      - 0.2
      - 0.98
    glow_color:
      - 0.0
      - 0.0
      - 0.0
      - 0.0
    glow_misc: { }
    misc:
      active: true
      touchable: false
      editable: false