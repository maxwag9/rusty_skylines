name: dropdown_option
elements:
  - !Rect
    id: Option Background
    actions:
      #- on:release button:left print(it works?!))
      # Clicking updates the main dropdown variable to this option's value
      #- on:release button:left set({{ap}_parent}, {{ap}})
      # Clicking closes the dropdown menu
      #- on:release button:left, print(Name in option:, strexpr:{split("{ap}", ".").0}_open))
      #- on:release button:left, print(Before:, {split("{ap}", ".").0}_open)

      - on:release button:left, set(expr:"{ap.1}" + "_open", bool:false)
      #- on:release button:left, print({split("{ap}", ".").0}.options)
      #- on:release button:left, print({split("{ap}", ".").0}, {ap})
      #- on:release button:left, print(strexpr:dd_{split("{ap}", ".").0}_layer)
      #- on:release button:left, print(strexpr:{split("{ap}", ".").0}_open)
      #- on:release button:left, print({split("{ap}", ".").0}_open)
      #- on:release button:left, print(split("{ap}", ".").0)
      #- on:release button:left, print({ap})
      - on:release button:left, set(str:{ap.1}, {ap.0});
      - on:release button:left, ifvareq(exprvar:"{ap.1}" + "_open", bool:false, forin(exprvar:{ap.1}.options, del_ap(self.menu, {ap.2}, expr:"{ap.1}" + "_Option_" + {idx})))
      - on:hover_enter, call(rust:play_sound, str:ButtonHover)
      - on:press, call(rust:play_sound, str:ButtonPress)
      #- on:release button:left, print(After:, {split("{ap}", ".").0}_open)Haha you got the rabbit hide and I got the rabbit meat
      - call(show_interaction, [[0.2, 0.2, 0.2, 1.0], false]))
    x: 0
    y: 0
    w: 240
    h: 60
    color:
      - 0.2
      - 0.2
      - 0.2
      - 1.0
    border_color:
      - 1.0
      - 1.0
      - 1.0
      - 0.5
    roundness: 0.1
    border_thickness: 4

  - !Text
    id: Option Text
    x: 0
    y: 0
    pt: 16.0
    border_width: 5.0
    color:
      - 1.0
      - 1.0
      - 1.0
      - 1.0
    text: "{{ap}}"
    anchor: Center
    misc:
      active: true
      touchable: false
      editable: true