name: PingPong
layers:
  - name: pingpong
    order: 2
    elements:
      - !Rect
        id: Background
        x: 960
        y: 540
        w: 1920
        h: 1080
        rotation: 0.0
        color:
          - 0.03
          - 0.03
          - 0.03
          - 1.0
        border_color:
          - 0.1
          - 0.1
          - 0.1
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness_percentage: 0.0
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: false
      - !Rect
        id: Center Line
        x: 960
        y: 540
        w: 30
        h: 1080
        rotation: 0.0
        color:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
        border_color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        texture: null
        roundness: 0.0
        border_thickness_percentage: 0.01
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.0
          - 0.0
          - 0.0
          - 0.0
        glow_misc: { }
        misc:
          active: true
          touchable: false
          editable: true
      - !Text
        id: ping_pong_text
        x: 960
        y: 50
        pt: 25.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: Ping Pong in Rusty Skylines UI!
      - !Text
        id: back_text
        actions:
          - on:r call(open_main_menus)
        x: 100
        y: 50
        pt: 18.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: <- Back to Main Menu
      - !Text
        id: faster_text
        actions:
          - on:d inc(str:ball.speed, 0.1)
        x: 100
        y: 150
        pt: 14.999999
        color:
          - 0.1
          - 1.0
          - 0.1
          - 1.0
        text: Make ball faster!
      - !Text
        id: slower_text
        actions:
          - on:d dec(str:ball.speed, 0.1)
        x: 100
        y: 120
        pt: 14.999999
        color:
          - 1.0
          - 0.1
          - 0.1
          - 1.0
        text: Make ball slower...
      - !Text
        id: home_score_text
        x: 100
        y: 80
        pt: 16.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: 'Home Score: {ball.home_score}'
        misc:
          active: true
          touchable: false
          editable: true
      - !Text
        id: visitor_score_text
        x: 1820
        y: 80
        pt: 16.0
        color:
          - 1.0
          - 1.0
          - 1.0
          - 1.0
        text: 'Visitor Score: {ball.visitor_score}'
        misc:
          active: true
          touchable: false
          editable: true
    editing_tool: false
  - name: pingpong_moving_stuff
    order: 2
    elements:
      - !Circle
        id: ball
        actions:
          - on:activated on:startup set(str:ball.orig_radius, self.radius); set(str:ball.squish, 1.0); set(str:ball.speed, 4.0); set(str:ball.velocity, [1.0, 1.0]); set(str:left_paddle.size, [0.0, 0.0]); set(str:left_paddle.center, [0.0, 0.0])
          - set(str:self.center.x, expr:{self.center.x} + {ball.velocity.x} * {ball.speed})
          - set(str:self.center.y, expr:{self.center.y} + {ball.velocity.y} * {ball.speed})
          - if(expr:{self.center.y} < {self.radius}, if(expr:{ball.velocity.y} * {ball.speed} < 0, set(str:ball.velocity.y, expr:-{ball.velocity.y})))
          - if(expr:{self.center.y} > {screen.y} - {self.radius}, if(expr:{ball.velocity.y} * {ball.speed} > 0, set(str:ball.velocity.y, expr:-{ball.velocity.y})); )
          #- print(["hey there it is I, markiplier", ball.velocity.y])
          - if(expr:{self.center.x} - {self.radius} < {left_paddle.center.x} + {left_paddle.size.x}*0.5 && {self.center.x} + {self.radius} > {left_paddle.center.x} - {left_paddle.size.x}*0.5 && {self.center.y} > {left_paddle.center.y} - {left_paddle.size.y}*0.5 && {self.center.y} < {left_paddle.center.y} + {left_paddle.size.y}*0.5 && {ball.velocity.x} < 0, set(str:ball.velocity.x, expr:-{ball.velocity.x}); set(str:left_paddle.knock_x, -15); set(str:ball.squish, 0.65))
          - if(expr:{self.center.x} - {self.radius} < {right_paddle.center.x} + {right_paddle.size.x}*0.5 && {self.center.x} + {self.radius} > {right_paddle.center.x} - {right_paddle.size.x}*0.5 && {self.center.y} > {right_paddle.center.y} - {right_paddle.size.y}*0.5 && {self.center.y} < {right_paddle.center.y} + {right_paddle.size.y}*0.5 && {ball.velocity.x} > 0, set(str:ball.velocity.x, expr:-{ball.velocity.x}); set(str:right_paddle.knock_x, 15); set(str:ball.squish, 0.65))
          - if(expr:{self.center.x} < 0, inc(str:ball.visitor_score, 1); set(str:ball.velocity.x, 1.5); set(str:ball.velocity.y, expr:random(-1.5, 1.5)); set(str:self.center.x, expr:{screen.x} * 0.5); set(str:self.center.y, expr:{screen.y} * 0.5); )
          - if(expr:{self.center.x} > {screen.x}, inc(str:ball.home_score, 1); set(str:ball.velocity.x, -1.5); set(str:ball.velocity.y, expr:random(-1.5, 1.5)); set(str:self.center.x, expr:{screen.x} * 0.5); set(str:self.center.y, expr:{screen.y} * 0.5))
          # Smooth squish recovery (lerp back to 1.0)
          - set(str:ball.squish, expr:{ball.squish} * 0.78 + 0.22)
          - set(str:self.radius, expr:{ball.orig_radius} * {ball.squish})
          - button:"KeyX" trigger:r in:any, set(str:ball.velocity, [0, 1]); print(did it)
        style: Hue Circle
        x: 0.0
        y: 0.0
        radius: 30.0
        fill_color:
          - 0.5
          - 0.5
          - 0.5
          - 0.98
        glow_color:
          - 0.2
          - 0.0
          - 0.7
          - 0.98
        glow_misc:
          glow_size: 40.0
          glow_speed: 5.0
          glow_intensity: 0.5
        misc:
          active: true
          touchable: false
          editable: true
      - !Rect
        id: left paddle
        actions:
          - on:activated set(str:left_paddle.orig_center_x, self.center.x); set(str:left_paddle.knock_x, 0.0); set(str:paddle_speed, 10.0)
          - button:"KeyW" if(expr:{self.center.y} - {self.size.y}*0.5 > {paddle_speed}+1, set(str:self.center.y, expr:{self.center.y} - {paddle_speed}))
          - button:"KeyS" if(expr:{self.center.y} + {self.size.y}*0.5 < {screen.y} - ({paddle_speed}+1), set(str:self.center.y, expr:{self.center.y} + {paddle_speed}))
          - set(str:left_paddle.size, self.size)
          - set(str:left_paddle.center, self.center)
          #- if(expr:{left_paddle.knock_x} != 0.0, set(str:self.center.x, expr:{self.center.x} + {left_paddle.knock_x}); set(str:left_paddle.knock_x, expr:{left_paddle.knock_x} * 0.82))
          #- set(str:self.center.x, expr:{self.center.x} * 0.92 + {left_paddle.orig_center_x} * 0.08)
        x: 50
        y: 540
        w: 20
        h: 200
        rotation: 0.0
        color:
          - 0.5
          - 1.0
          - 0.5
          - 1.0
        border_color:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
        texture: null
        roundness: 0.3
        border_thickness_percentage: 0.01
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.2
          - 0.7
          - 0.2
          - 0.98
        glow_misc:
          glow_size: 30.0
          glow_speed: 4.0
          glow_intensity: 0.5
        misc:
          active: true
          touchable: false
          editable: true
      - !Rect
        id: right paddle
        actions:
          - on:activated set(str:right_paddle.orig_center_x, self.center.x); set(str:right_paddle.knock_x, 0.0)
          - button:"ArrowUp" if(expr:{self.center.y} - {self.size.y}*0.5 > {paddle_speed}+1, set(str:self.center.y, expr:{self.center.y} - {paddle_speed}))
          - button:"ArrowDown" if(expr:{self.center.y} + {self.size.y}*0.5 < {screen.y} - ({paddle_speed}+1), set(str:self.center.y, expr:{self.center.y} + {paddle_speed}))
          - set(str:right_paddle.size, self.size)
          - set(str:right_paddle.center, self.center)
          - if(expr:{right_paddle.knock_x} != 0.0, set(str:self.center.x, expr:{self.center.x} + {right_paddle.knock_x}); set(str:right_paddle.knock_x, expr:{right_paddle.knock_x} * 0.82))
          - set(str:self.center.x, expr:{self.center.x} * 0.92 + {right_paddle.orig_center_x} * 0.08)
        x: 1870
        y: 540
        w: 20
        h: 200
        rotation: 0.0
        color:
          - 1.0
          - 0.5
          - 0.5
          - 1.0
        border_color:
          - 0.0
          - 0.0
          - 0.0
          - 1.0
        texture: null
        roundness: 0.3
        border_thickness_percentage: 0.01
        fade: 0.0
        blur: 0.0
        glow_color:
          - 0.7
          - 0.0
          - 0.2
          - 0.98
        glow_misc:
          glow_size: 30.0
          glow_speed: 4.0
          glow_intensity: 0.5
        misc:
          active: true
          touchable: false
          editable: true
    editing_tool: false
